# ---------------------------------------------------------------------------
# CTMS backend configuration
#
# Credentials are NEVER hardcoded here. They are read from environment
# variables (see backend/.env.example). The defaults below only work for a
# local MySQL installation with a "root" user that has no password.
# ---------------------------------------------------------------------------
spring.application.name=CTMS
server.port=${CTMS_SERVER_PORT:8080}

# --- MySQL datasource (default profile) ---
spring.datasource.url=${CTMS_DB_URL:jdbc:mysql://localhost:3306/ctms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${CTMS_DB_USERNAME:root}
spring.datasource.password=${CTMS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate ---
# "update" lets Hibernate align the schema with the entities on start-up.
# database/schema.sql holds the explicit DDL used for a clean install.
spring.jpa.hibernate.ddl-auto=${CTMS_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${CTMS_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JSON ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# --- CORS: origin of the React dev server ---
ctms.cors.allowed-origins=${CTMS_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# Demo/sample data loader (disabled by default, enabled by the "h2" profile)
ctms.demo-data.enabled=false

logging.level.com.ctms=INFO

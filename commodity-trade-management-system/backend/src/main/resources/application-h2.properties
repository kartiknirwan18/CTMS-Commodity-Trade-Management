# ---------------------------------------------------------------------------
# "h2" profile: credential-free local run and test configuration.
#
#   mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
#
# Data lives in an in-memory database and disappears when the process stops.
# The schema is created from the JPA entities and a small set of demo records
# is inserted on start-up so the dashboard has something to show.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ctms;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load the demo commodity/trade/contract data set on start-up.
ctms.demo-data.enabled=true

logging.level.com.ctms=INFO
